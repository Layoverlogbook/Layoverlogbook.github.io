<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layover Logbook</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#13233F;color:#F3F7F9;font:16px/1.5 system-ui,"Segoe UI",sans-serif;text-align:center}
  main{max-width:26rem;padding:2rem}
  h1{font-size:2rem;margin:0 0 .6rem;letter-spacing:.01em}
  p{color:#B9C8D6;margin:0 0 1.6rem}
  button{font:700 1rem system-ui,"Segoe UI",sans-serif;background:#F0B429;color:#13233F;border:0;border-radius:999px;padding:.85rem 1.6rem;cursor:pointer}
  button:hover{background:#fff}
</style>
</head>
<body>
<main>
  <h1>No connection</h1>
  <p>Layover Logbook needs the internet the first time it opens. Connect to Wi-Fi or data, then try again.</p>
  <button type="button" onclick="location.href='https://layoverlogbook.github.io/app.html'">Try again</button>
</main>
</body>
</html>
