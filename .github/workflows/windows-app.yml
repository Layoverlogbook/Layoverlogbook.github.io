name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installer and portable .exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.v.outputs.version }}
          name: Layover Logbook for Windows ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Layover Logbook for Windows.

            - **LayoverLogbook-Setup.exe**: installs the app with Start menu and desktop shortcuts.
            - **LayoverLogbook-Portable.exe**: runs without installing.

            Windows may show "Windows protected your PC" the first time. Click **More info**, then **Run anyway**.
          files: |
            desktop/dist/LayoverLogbook-Setup.exe
            desktop/dist/LayoverLogbook-Portable.exe
